name: CI

# Merge wall for every branch. Vercel builds and deploys separately through its
# Git integration (main -> Production, everything else -> Preview).
on:
  push:
    branches: [main, development, moaz-playground]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A disposable Postgres for tests/postgres.test.mjs (migrations, the owner's
    # setup SQL, forced row level security). Without TEST_DATABASE_URL those skip.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (frozen lockfile)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Design guard (counts may only go down; scripts/design-baseline.json)
        run: npm run check:design
      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/studio_test?sslmode=disable
      - name: Build
        run: npm run build

  # Every screen in a real browser (npm run check:ui): the production build
  # against this Postgres, a mocked Supabase Auth and an S3 stand-in; the Studio
  # server cannot reach the network, and no provider key is set. Fails when a
  # count in scripts/ui-baseline.json goes up. The report (and screenshots, kept
  # for 7 days, synthetic data only) is uploaded as the "ui-report" artifact.
  ui:
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studio_ui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (frozen lockfile)
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: UI harness and performance baseline
        run: npm run check:ui -- --perf --shots
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/studio_ui?sslmode=disable
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-report
          path: ui-report/
          retention-days: 7
          if-no-files-found: warn

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned + checksummed)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o gitleaks.tgz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan full history
        run: ./gitleaks git . --no-banner --redact -v
