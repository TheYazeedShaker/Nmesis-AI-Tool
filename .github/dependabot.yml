version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # React and its type packages must stay on matching versions.
      react:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      react-security:
        applies-to: security-updates
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # Major upgrades of these are done deliberately, not by Dependabot.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
